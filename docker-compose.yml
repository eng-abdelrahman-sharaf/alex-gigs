version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alex-gigs-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alex_gigs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./AI/starter_schema.sql:/docker-entrypoint-initdb.d/starter_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alex_gigs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alex-gigs-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: alex_gigs
      JWT_SECRET: super_secret_jwt_sign_key_change_me_in_production
      JWT_EXPIRES_IN: 7d
      DB_PEPPER: alex_gigs_secret_pepper_salt_extra_protection_987654321

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: alex-gigs-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      PORT: 3000

volumes:
  pgdata:
